# Deploys Forge on every push to main:
#   1. web app → Firebase Hosting (live channel)
#   2. Cloud Functions + Firestore rules, when the deploy service account secret exists

name: Deploy to Firebase on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      HAS_DEPLOY_SA: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm test && npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_GS_INTERVIEW_PREP }}
          channelId: live
          projectId: gs-interview-prep
      # Needs a service account with Cloud Functions Admin, Service Account User,
      # Firebase Rules Admin and Artifact Registry Writer. Skipped until the
      # FIREBASE_DEPLOY_SERVICE_ACCOUNT secret is added.
      - name: Deploy Cloud Functions and Firestore rules
        if: env.HAS_DEPLOY_SA == 'true'
        run: |
          echo "$DEPLOY_SA" > "$RUNNER_TEMP/deploy-sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/deploy-sa.json"
          npm --prefix functions ci
          npx --yes firebase-tools@14 deploy --only functions,firestore:rules --project gs-interview-prep --non-interactive --force
        env:
          DEPLOY_SA: ${{ secrets.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
